version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dart"
    # `files_tech_core` est declare en `path: ../files_tech_core`, donc hors du
    # depot. Dependabot ne peut pas resoudre ce chemin dans son checkout : il
    # rendait `unknown_error` sur cette seule dependance et faisait echouer TOUT
    # le job pub, chaque lundi depuis au moins le 2026-05-25 (13 runs rouges
    # consecutifs, jamais remontes). L'ignorer laisse passer le reste.
    #
    # AI Tech est la seule app du portefeuille dans ce cas : pass_tech,
    # notes_tech, pdf_tech et read_files_tech declarent `files_tech_core` en
    # `git:`, que Dependabot sait traiter.
    ignore:
      - dependency-name: "files_tech_core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "android"
    # Les bumps majeurs côté Android Gradle Plugin / Kotlin / Gradle Wrapper
    # cassent systématiquement la CI tant que Flutter ne suit pas. On les
    # ignore — on les fera à la main quand Flutter aura validé.
    ignore:
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
